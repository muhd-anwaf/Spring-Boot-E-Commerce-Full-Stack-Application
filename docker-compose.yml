# Local PostgreSQL for development:  docker compose --env-file backend/.env up -d db
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sb_ecom
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in backend/.env}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
