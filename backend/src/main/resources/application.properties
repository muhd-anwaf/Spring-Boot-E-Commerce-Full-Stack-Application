spring.application.name=sb-ecom

# Optional backend/.env file (KEY=value lines) is read when the app is started from /backend.
# Real environment variables always work too. See backend/.env.example.
spring.config.import=optional:file:.env[.properties]

# --- Database (PostgreSQL by default) ---
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/sb_ecom}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:update}
spring.jpa.show-sql=${SHOW_SQL:false}

# --- Uploads ---
project.image=${IMAGE_DIR:images/}
image.base.url=${IMAGE_BASE_URL:http://localhost:8080/images/}
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# --- Security ---
spring.ecom.app.jwtCookieName=springBootEcom
# JWT_SECRET must be a Base64 string of at least 32 bytes, e.g. `openssl rand -base64 32`
spring.app.jwtSecret=${JWT_SECRET}
# Default: 24 hours
spring.app.jwtExpirationMs=${JWT_EXPIRATION_MS:86400000}
# Comma-separated list of allowed browser origins
frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- Demo data (off by default) ---
app.seed.enabled=${APP_SEED_ENABLED:false}
app.seed.password=${SEED_PASSWORD:ChangeMe123!}

# --- Logging ---
logging.level.root=INFO
logging.level.com.ecommerce.project=${LOG_LEVEL:INFO}
