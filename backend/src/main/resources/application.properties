spring.application.name=sb-ecom

#spring.h2.console.enabled=true
#spring.datasource.url=jdbc:h2:mem:test

spring.datasource.url=jdbc:postgresql://localhost:5432/sb_ecom
spring.datasource.username=postgres
# Provide these in the runtime environment; JWT_SECRET must be Base64-encoded.
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true

#spring.jpa.properties.hibernate.format_sql=true

project.image=images/
spring.ecom.app.jwtCookieName=springBootEcom
spring.app.jwtSecret=${JWT_SECRET}
spring.app.jwtExpirationMs=3000000

logging.level.org.springframework=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.com.ecommerce.project=DEBUG

frontend.url=http://localhost:5173
image.base.url=http://localhost:8080/images/
